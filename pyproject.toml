[project]
name = "ethical-hacking-chatbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "streamlit>=1.39,<2.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.vercel]
entrypoint = "backend.api:app"
